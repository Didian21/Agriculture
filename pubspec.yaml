name: agriculture
description: "PAGRI - Pagsanjan Agricultural Decision Support System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.2.1
  intl: any
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  supabase_flutter: ^2.8.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/pagri_logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/pagri_logo.png"
    icon_size: 48

flutter:

  uses-material-design: true
  generate: true

  assets:
    - Pagri.jpg
    - assets/images/pagri_logo.png
    - assets/images/crops/
    - assets/MAP/
    - assets/File_Template/
