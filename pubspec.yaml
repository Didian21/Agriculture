name: agriculture
description: "Agriculture Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.2.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  # Mga kailangang packages para sa mapa at GeoJSON:
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Sundin ang tamang indentation na ito para sa mga assets:
  assets:
    - Pagri.jpg
    - assets/images/pagri_logo.png
    - pagsanjanmapcipped.geojson
    - assets/Map/
