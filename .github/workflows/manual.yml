name: Weekly ML update

on:
  schedule:
    - cron: "0 0 * * 1"        # every Monday 00:00 UTC = 8:00 AM Philippine time
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      force_retrain:
        description: "Retrain even if nothing changed"
        type: boolean
        default: false

concurrency:
  group: weekly-ml
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Refresh weather, retrain if needed, update Supabase
        run: python ml/pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RETRAIN: ${{ inputs.force_retrain || 'false' }}

      - name: Keep trained model as a backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-output
          path: ml/out/
          if-no-files-found: ignore
          retention-days: 30
