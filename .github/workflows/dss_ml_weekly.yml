name: Weekly Pagsanjan DSS ML Retraining

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (Weekly automatic retrain)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  retrain-ml-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ML & Supabase Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests scikit-learn statsmodels supabase

      - name: Execute Machine Learning Pipeline & Update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python ml/dss_pagsanjan_ml.py

      - name: Upload Export Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dss-ml-exports
          path: ml_export/
